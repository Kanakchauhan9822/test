<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Mini Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL WORKSPACE</p>
        <h1>TaskFlow<span>.</span></h1>
        <p class="subtitle">A small space to get things done.</p>
      </div>
      <button id="logoutButton" class="secondary hidden">Log out</button>
    </header>

    <section id="authPanel" class="panel auth-panel">
      <div class="tabs">
        <button id="showLogin" class="tab active">Login</button>
        <button id="showRegister" class="tab">Register</button>
      </div>
      <form id="authForm">
        <label id="nameLabel" class="hidden">Name
          <input id="name" type="text" placeholder="Your name" />
        </label>
        <label>Email
          <input id="email" type="email" placeholder="you@example.com" required />
        </label>
        <label>Password
          <input id="password" type="password" placeholder="Password" required />
        </label>
        <button id="authSubmit" class="primary" type="submit">Login</button>
      </form>
      <p id="authMessage" class="message"></p>
    </section>

    <section id="appPanel" class="hidden">
      <div class="welcome-row">
        <div>
          <p class="eyebrow">YOUR TASKS</p>
          <h2 id="welcomeText">Welcome back</h2>
        </div>
        <div class="stats">
          <div><strong id="totalCount">0</strong><span>Total</span></div>
          <div><strong id="doneCount">0</strong><span>Completed</span></div>
        </div>
      </div>

      <form id="taskForm" class="panel task-form">
        <h3>Create a task</h3>
        <div class="form-grid">
          <label>Task title
            <input id="taskTitle" type="text" placeholder="e.g. Finish assignment" required />
          </label>
          <label>Priority
            <select id="taskPriority">
              <option>Low</option><option selected>Medium</option><option>High</option>
            </select>
          </label>
        </div>
        <label>Description
          <input id="taskDescription" type="text" placeholder="Add a short description (optional)" />
        </label>
        <button class="primary" type="submit">Add task</button>
        <p id="taskMessage" class="message"></p>
      </form>

      <div class="toolbar">
        <div>
          <h3>All tasks</h3>
          <p class="subtitle">Keep your next step visible.</p>
        </div>
        <div class="filters">
          <select id="statusFilter">
            <option value="all">All status</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
          <select id="priorityFilter">
            <option value="">All priorities</option>
            <option>Low</option><option>Medium</option><option>High</option>
          </select>
        </div>
      </div>
      <div id="taskList" class="task-list"></div>
    </section>
    <footer>TaskFlow demo · Built for code-review testing</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
